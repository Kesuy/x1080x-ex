name: Validate hdblog unified settings and download area toggle

on:
  push:
    branches: [feat/hdblog-article-layout-download]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply hdblog changes
        run: python3 .github/scripts/apply-hdblog-settings.py

      - name: Install dependencies
        run: npm ci

      - name: Full validation
        run: npm run check

      - name: Commit rebuilt userscript and remove temporary CI helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-hdblog-settings-download-area.yml .github/scripts/apply-hdblog-settings.py
          git add src/hdblog-article.js src/hdblog-search.js test/hdblog-article.test.js dist/x1080x-ex.user.js
          git commit -m "feat: unify hdblog settings and toggle download area"
          git push origin HEAD:feat/hdblog-article-layout-download
