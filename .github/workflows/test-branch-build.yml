name: Build agaghhh test userscript

on:
  push:
    branches:
      - test/agaghhh-real-actress

permissions:
  contents: write

jobs:
  build-test-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/agaghhh-real-actress
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Commit test build
        run: |
          if git diff --quiet -- dist/x1080x-ex.user.js; then
            echo "dist already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/x1080x-ex.user.js
          git commit -m "build: refresh agaghhh test userscript"
          git push
