name: Release userscript

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test, build and smoke
        run: npm run check

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Chinese release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          NOTES_FILE=".github/release-notes/v${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::缺少中文发布说明：$NOTES_FILE"
            exit 1
          fi
          NOTES_FILE="$NOTES_FILE" node -e 'const fs = require("node:fs"); const note = fs.readFileSync(process.env.NOTES_FILE, "utf8").trim(); const han = (note.match(/[\u3400-\u9fff]/gu) || []).length; if (han < 20) { console.error("发布说明必须包含实质中文更新内容（不少于20个汉字）"); process.exit(1); }'

      - name: Update built userscript on main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if git diff --quiet -- dist/x1080x-ex.user.js; then
            echo "dist is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/x1080x-ex.user.js
          git commit -m "release: update built userscript for v$VERSION"
          git push

      - name: Package optional Chrome native-filename extension
        shell: bash
        run: |
          cd extras
          zip -q -r ../sehuatang-filename-chrome.zip sehuatang-chrome-filename
          test -s ../sehuatang-filename-chrome.zip

      - name: Create or update GitHub Release with Chinese notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$NOTES_FILE"
            gh release upload "$TAG" dist/x1080x-ex.user.js sehuatang-filename-chrome.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/x1080x-ex.user.js sehuatang-filename-chrome.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          fi
