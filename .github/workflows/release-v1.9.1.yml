name: Release v1.9.1

on:
  push:
    branches:
      - release/v1.9.1
    paths:
      - .github/workflows/release-v1.9.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.9.1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare v1.9.1 metadata
        shell: bash
        run: |
          npm version 1.9.1 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'(raw\.githubusercontent\.com/Kesuy/x1080x-ex/main/dist/x1080x-ex\.user\.js\?v=)\d+\.\d+\.\d+', r'\g<1>1.9.1', text)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Full check
        run: npm run check

      - name: Verify built version
        shell: bash
        run: |
          grep -q '^// @version      1.9.1$' dist/x1080x-ex.user.js
          grep -q 'main/dist/x1080x-ex.user.js' dist/x1080x-ex.user.js

      - name: Publish v1.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/release-v1.9.1.yml
          git add package.json package-lock.json README.md dist/x1080x-ex.user.js .github/workflows/release-v1.9.1.yml
          git commit -m "release: v1.9.1"
          FINAL_SHA="$(git rev-parse HEAD)"

          git push origin HEAD:release/v1.9.1
          git push origin "$FINAL_SHA":refs/heads/main
          git tag -a v1.9.1 -m "v1.9.1" "$FINAL_SHA"
          git push origin v1.9.1

          git archive --format=zip --output=x1080x-ex-v1.9.1-source.zip "$FINAL_SHA"
          cp dist/x1080x-ex.user.js x1080x-ex.user.js

          gh release create v1.9.1 \
            x1080x-ex.user.js \
            x1080x-ex-v1.9.1-source.zip \
            --title "v1.9.1" \
            --notes $'修复 agaghhh BT 种子文件命名：当标题为「番号 [BT](发布组)(内部编号) 正文」时，下载后的 .torrent 只保留「番号 + 正文标题」。\n\n示例：\nAVSA-428 [BT](AVS collector’s)(avsa00428) 追放失敗…\n→ AVSA-428 追放失敗….torrent\n\nRAR、封面与 Preview 命名规则不变。'
