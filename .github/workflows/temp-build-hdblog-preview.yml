name: Temporary build hdblog preview

on:
  push:
    branches:
      - feature/hdblog-preview-large

permissions:
  contents: write

concurrency:
  group: temp-hdblog-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/hdblog-preview-large

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Run checks and build
        run: npm run check

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json dist/x1080x-ex.user.js
          if git diff --cached --quiet; then
            echo "generated files are already up to date"
            exit 0
          fi
          git commit -m "build: update userscript dist"
          git push origin HEAD:feature/hdblog-preview-large
