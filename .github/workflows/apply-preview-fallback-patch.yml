name: Apply preview fallback patch

on:
  push:
    branches:
      - test/agaghhh-hdblog-preview
    paths:
      - .github/workflows/apply-preview-fallback-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/agaghhh-hdblog-preview
      - name: Apply source patches
        run: python scripts/apply_preview_fallback_patch.py
      - name: Commit patched sources
        run: |
          git config user.name 'xshare.cc'
          git config user.email 'nicbest@163.com'
          git add src/agaghhh-hdblog-preview.js src/userscript.js scripts/smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: download preview images and add official fallback flow'
          git push origin HEAD:test/agaghhh-hdblog-preview
