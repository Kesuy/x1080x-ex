name: Validate hdblog grid column fix

on:
  push:
    branches: [feat/hdblog-article-layout-download]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply grid placement fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/hdblog-article.js')
          source = path.read_text(encoding='utf-8')
          old_wrap = "  body.${ARTICLE_BODY_CLASS} .content-sidebar-wrap {\n    display: grid !important;\n    grid-template-columns: minmax(0, 1fr) var(--x1080x-hdblog-sidebar-width) !important;\n    column-gap: var(--x1080x-hdblog-column-gap) !important;\n    align-items: start !important;\n  }\n"
          new_wrap = "  body.${ARTICLE_BODY_CLASS} .content-sidebar-wrap {\n    display: grid !important;\n    grid-template-columns: minmax(0, var(--x1080x-hdblog-article-width)) var(--x1080x-hdblog-sidebar-width) !important;\n    column-gap: var(--x1080x-hdblog-column-gap) !important;\n    justify-content: center !important;\n    align-items: start !important;\n    position: static !important;\n    float: none !important;\n  }\n  body.${ARTICLE_BODY_CLASS} .content-sidebar-wrap::before,\n  body.${ARTICLE_BODY_CLASS} .content-sidebar-wrap::after {\n    content: none !important;\n    display: none !important;\n  }\n"
          if old_wrap not in source: raise SystemExit('desktop wrapper block not found')
          source = source.replace(old_wrap, new_wrap, 1)
          old_main = "  body.${ARTICLE_BODY_CLASS} main#genesis-content,\n  body.${ARTICLE_BODY_CLASS} #genesis-content.content {\n    width: 100% !important;\n    max-width: var(--x1080x-hdblog-article-width) !important;\n    float: none !important;\n    margin: 0 !important;\n  }\n"
          new_main = "  body.${ARTICLE_BODY_CLASS} main#genesis-content,\n  body.${ARTICLE_BODY_CLASS} #genesis-content.content {\n    grid-column: 1 !important;\n    grid-row: 1 !important;\n    width: 100% !important;\n    max-width: var(--x1080x-hdblog-article-width) !important;\n    min-width: 0 !important;\n    justify-self: stretch !important;\n    align-self: start !important;\n    float: none !important;\n    position: static !important;\n    left: auto !important;\n    right: auto !important;\n    transform: none !important;\n    margin: 0 !important;\n  }\n"
          if old_main not in source: raise SystemExit('desktop main block not found')
          source = source.replace(old_main, new_main, 1)
          old_sidebar = "  body.${ARTICLE_BODY_CLASS} .sidebar-primary,\n  body.${ARTICLE_BODY_CLASS} aside.sidebar-primary {\n    width: 100% !important;\n    max-width: var(--x1080x-hdblog-sidebar-width) !important;\n    float: none !important;\n    margin-left: 0 !important;\n    margin-right: 0 !important;\n  }\n"
          new_sidebar = "  body.${ARTICLE_BODY_CLASS} .sidebar-primary,\n  body.${ARTICLE_BODY_CLASS} aside.sidebar-primary {\n    grid-column: 2 !important;\n    grid-row: 1 !important;\n    width: 100% !important;\n    max-width: var(--x1080x-hdblog-sidebar-width) !important;\n    min-width: 0 !important;\n    justify-self: stretch !important;\n    align-self: start !important;\n    float: none !important;\n    position: static !important;\n    left: auto !important;\n    right: auto !important;\n    transform: none !important;\n    margin-left: 0 !important;\n    margin-right: 0 !important;\n  }\n"
          if old_sidebar not in source: raise SystemExit('desktop sidebar block not found')
          source = source.replace(old_sidebar, new_sidebar, 1)
          old_mobile = "  body.${ARTICLE_BODY_CLASS} main#genesis-content,\n  body.${ARTICLE_BODY_CLASS} #genesis-content.content,\n  body.${ARTICLE_BODY_CLASS} .sidebar-primary,\n  body.${ARTICLE_BODY_CLASS} aside.sidebar-primary {\n    width: 100% !important;\n    max-width: none !important;\n    float: none !important;\n    margin-left: 0 !important;\n    margin-right: 0 !important;\n  }\n"
          new_mobile = "  body.${ARTICLE_BODY_CLASS} main#genesis-content,\n  body.${ARTICLE_BODY_CLASS} #genesis-content.content,\n  body.${ARTICLE_BODY_CLASS} .sidebar-primary,\n  body.${ARTICLE_BODY_CLASS} aside.sidebar-primary {\n    grid-column: auto !important;\n    grid-row: auto !important;\n    width: 100% !important;\n    max-width: none !important;\n    float: none !important;\n    position: static !important;\n    left: auto !important;\n    right: auto !important;\n    transform: none !important;\n    margin-left: 0 !important;\n    margin-right: 0 !important;\n  }\n"
          if old_mobile not in source: raise SystemExit('mobile shared block not found')
          source = source.replace(old_mobile, new_mobile, 1)
          path.write_text(source, encoding='utf-8')
          test_path = Path('test/hdblog-article.test.js')
          test = test_path.read_text(encoding='utf-8')
          anchor = "  assert.match(style.textContent, /display:\\s*grid !important/);\n"
          extra = "  assert.match(style.textContent, /grid-column:\\s*1 !important/);\n  assert.match(style.textContent, /grid-column:\\s*2 !important/);\n  assert.match(style.textContent, /content-sidebar-wrap::before/);\n  assert.match(style.textContent, /content:\\s*none !important/);\n"
          if anchor not in test: raise SystemExit('test assertion anchor not found')
          if 'content-sidebar-wrap::before' not in test: test = test.replace(anchor, anchor + extra, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Full validation
        run: npm run check

      - name: Commit rebuilt userscript and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-hdblog-grid-fix.yml
          git add src/hdblog-article.js test/hdblog-article.test.js dist/x1080x-ex.user.js
          git commit -m "fix: keep hdblog article in left content column"
          git push origin HEAD:feat/hdblog-article-layout-download
