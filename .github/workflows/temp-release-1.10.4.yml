name: Release Pixhost alias Preview fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore v1.10.1 implementation baseline
        run: |
          git checkout v1.10.1 -- src/core.js src/agaghhh-hdblog-preview.js test/agaghhh-hdblog-preview.test.js
          rm -f test/preview-duplicate.test.js
      - name: Apply Pixhost alias dedupe fix
        run: python scripts/temp-preview-alias-fix.py
      - name: Test v1.10.1 baseline plus fix
        run: npm test
      - name: Bump patch version
        run: npm version patch --no-git-tag-version
      - run: npm run build
      - run: npm run smoke
      - name: Remove temporary release helpers
        run: |
          rm -f scripts/temp-preview-alias-fix.py
          rm -f .github/workflows/temp-release-1.10.4.yml
      - name: Commit release files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add -A
          git commit -m "release: v${VERSION}"
          git push
      - name: Prepare release
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          git archive --format=zip --output="x1080x-ex-v${VERSION}-source.zip" HEAD
          cat > release-notes.md <<'EOF'
          ## Pixhost Preview 去重修复（基于 v1.10.1 重做）

          - 撤回 v1.10.2 / v1.10.3 的错误 Preview 过滤方案，核心实现恢复到 v1.10.1 基础。
          - 修复同一 Pixhost 资源因 `pixhost.to` / `pixhost.cc` 域名不同而被识别成两张 Preview 的问题。
          - `/show/...jpg` 展示页不再因为文件名以 `.jpg` 结尾而被误当图片直链。
          - 同一资源的 `/show/`、`/images/`、`/thumbs/` 形式统一按目录编号 + 文件名去重。
          - 渲染 HDblog Preview 前会与帖子主楼已有 Pixhost 图片比对；已有的同一张图不重复插入。
          - 针对 CEMD-826 的 `pixhost.to/show/7097/713938047_cemd-826_6m-mp4.jpg` 与 `pixhost.cc/show/7097/713938047_cemd-826_6m-mp4.jpg` 增加回归测试。

          ## 验证

          npm test、npm run build、npm run smoke 全部通过后发布。
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: x1080x-ex v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/x1080x-ex.user.js
            x1080x-ex-v${{ steps.version.outputs.version }}-source.zip
