name: Validate centered original-width hdblog content

on:
  push:
    branches: [feat/hdblog-article-layout-download]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply centered inner-content fix
        run: echo '' | base64 -d | python3
      - name: Install dependencies
        run: npm ci
      - name: Full validation
        run: npm run check
      - name: Commit rebuilt userscript and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-hdblog-centered-inner-content.yml
          git add src/hdblog-article.js test/hdblog-article.test.js dist/x1080x-ex.user.js
          git commit -m "fix: center original-width article inside custom hdblog column"
          git push origin HEAD:feat/hdblog-article-layout-download
