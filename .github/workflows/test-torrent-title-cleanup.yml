name: Test torrent title cleanup

on:
  push:
    branches:
      - test/torrent-title-cleanup
    paths:
      - .github/workflows/test-torrent-title-cleanup.yml
      - scripts/apply-torrent-title-cleanup.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/torrent-title-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply-torrent-title-cleanup.py
      - run: npm ci
      - run: npm run check
      - name: Commit tested source and build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core.js test/core.test.js dist/x1080x-ex.user.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize torrent title groups"
          git push origin HEAD:test/torrent-title-cleanup
