name: Validate and release v1.7.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync lockfile version
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Full validation
        run: npm run check

      - name: Commit generated release files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.7.0.yml
          git add package-lock.json dist/x1080x-ex.user.js
          git commit -m "chore: build v1.7.0 and remove temporary release workflow"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag v1.7.0
          git push origin v1.7.0

      - name: Create release assets
        run: |
          git archive --format=zip --prefix=x1080x-ex-1.7.0/ --output=x1080x-ex-1.7.0-source.zip HEAD
          cat > release-notes.md <<'NOTES'
          ## 更新内容

          - hdblog.me 文章详情页新增主内容区宽度自定义；留空时完全使用网站默认宽度。
          - 自定义宽度模式下保留网站原正文宽度并居中，两侧留白与白色主内容背景一起自适应扩展。
          - 优化 HDblog.me 标题区、导航菜单、正文与侧栏的自适应布局，修复正文错位、窄列和突兀卡片感。
          - 新增统一的 `⚙️ hdblog 设置` 面板，集中管理文章宽度、网盘下载区域、图片下载按钮、Preview 大图和搜索屏蔽关键词。
          - 新增网盘下载区域显示开关，可隐藏 Btfile / Btafile、katfile、Freedl、Rapidgator 到 `Preview:` 前的下载链接区，Preview 保持显示。
          - 标题旁新增可开关的 `⬇` 图片下载按钮，只下载 Preview 区 Pixhost `show` 对应的大图。
          - 下载图片自动按番号命名；支持普通番号和 FC2-PPV，多个 Preview 图片自动追加 `-1`、`-2` 等序号。
          - Preview 大图显示新增独立开关；关闭后保留网站原始缩略图。
          - Preview 大图宽度改为与 hdblog 主内容列对齐，不再接近整页视口宽度跨入侧栏。
          - 保留并兼容现有 hdblog 搜索关键词屏蔽、唯一结果自动跳转、Pixhost 原图解析及其他既有功能。

          ## 验证

          - Node 22 下执行完整 `npm run check`。
          - 自动化测试、build、smoke 全部通过后才创建正式标签和 Release。
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.7.0 \
            dist/x1080x-ex.user.js \
            x1080x-ex-1.7.0-source.zip \
            --title "x1080x-ex v1.7.0" \
            --notes-file release-notes.md
