name: Validate and release v1.6.5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync lockfile version
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Full validation
        run: npm run check

      - name: Commit generated release files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.6.5.yml
          git add package-lock.json dist/x1080x-ex.user.js
          git commit -m "chore: build v1.6.5 and remove temporary release workflow"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag v1.6.5
          git push origin v1.6.5

      - name: Create release assets
        run: |
          git archive --format=zip --prefix=x1080x-ex-1.6.5/ --output=x1080x-ex-1.6.5-source.zip HEAD
          cat > release-notes.md <<'NOTES'
          ## 更新内容

          - 新增 hdblog.me 搜索结果标题关键词屏蔽，默认屏蔽 `モザイク破壊`。
          - 油猴菜单新增“设置 hdblog 搜索屏蔽关键词”，支持多关键词配置，留空可关闭屏蔽。
          - 搜索结果过滤后仅剩 1 条时自动跳转到真实详情页；0 条不跳转；多条继续保留结果页。
          - IPZZ-941 示例中会过滤 `(モザイク破壊) ...` 结果并跳转到 `https://hdblog.me/985910/ipzz-941/`。
          - 构建脚本改为从 `package.json` 自动读取 userscript 版本号，避免版本号重复维护。

          ## 验证

          - Node 22 下执行完整 `npm run check`。
          - 新增关键词解析、匹配、0/1/多结果分支及 DOM 过滤测试。
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.6.5 \
            dist/x1080x-ex.user.js \
            x1080x-ex-1.6.5-source.zip \
            --title "x1080x-ex v1.6.5" \
            --notes-file release-notes.md
