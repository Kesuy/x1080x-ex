name: Validate and release v1.8.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync lockfile version
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Full validation
        run: npm run check

      - name: Commit generated release files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.8.0.yml
          git add package-lock.json dist/x1080x-ex.user.js
          git commit -m "chore: build v1.8.0 and remove temporary release workflow"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag v1.8.0
          git push origin v1.8.0

      - name: Create release assets
        run: |
          git archive --format=zip --prefix=x1080x-ex-1.8.0/ --output=x1080x-ex-1.8.0-source.zip HEAD
          cat > release-notes.md <<'NOTES'
          ## 更新内容

          - `hdblog` 与 `x1080x` 的增强设置改为两个独立入口，互不混用。
          - 新增独立的 `⚙️ x1080x 设置`，可分别开关：批量打开帖子、下载增强、查真实演员信息。
          - `agaghhh.cc` 帖子在“出演者”为空时，可按番号查询 `av-wiki.net` 获取真实演员。
          - 查到演员后，在原有附件/标题型文件名末尾追加演员名；番号图片仍保持 `番号.jpg`。
          - av-wiki 查询失败、超时或页面结构变化时自动回退原命名，不影响原有下载。
          - 真实演员查询只在对应开关开启且用户点击下载时触发；帖子已有出演者时不会访问 av-wiki。

          ## 验证

          - 新增测试覆盖 BLOR-306 -> 桜野桃 的 av-wiki 解析和演员名追加逻辑。
          - 新增测试确认 x1080x 三个开关互相独立，并确认 x1080x 设置面板不混入 hdblog 选项。
          - Node 22 下执行完整 `npm run check`，测试、build、smoke 全部通过后才创建正式标签和 Release。
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.8.0 \
            dist/x1080x-ex.user.js \
            x1080x-ex-1.8.0-source.zip \
            --title "x1080x-ex v1.8.0" \
            --notes-file release-notes.md
