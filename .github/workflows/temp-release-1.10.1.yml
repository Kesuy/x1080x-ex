name: Build agaghhh search redirect release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bump patch version
        run: npm version patch --no-git-tag-version
      - name: Apply agaghhh search redirect patch
        run: python scripts/temp-agaghhh-search-redirect.py
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Remove temporary release helpers
        run: |
          rm -f scripts/temp-agaghhh-search-redirect.py
          rm -f .github/workflows/temp-release-1.10.1.yml
      - name: Commit release files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add -A
          git commit -m "release: v${VERSION}"
          git push
      - name: Prepare release
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          git archive --format=zip --output="x1080x-ex-v${VERSION}-source.zip" HEAD
          cat > release-notes.md <<'EOF'
          ## agaghhh 搜索单结果自动跳转

          - agaghhh.cc 论坛搜索第一页仅有 1 个唯一主题时自动进入该主题。
          - 0 个、多个结果以及第 2 页以后均不自动跳转，避免误跳。
          - 新增独立开关「搜索单结果自动跳转」，位于「⚙️ x1080x 设置」，默认开启。
          - 遵循 AGENTS.md：用户可感知的新功能必须提供独立开关。

          ## 验证

          npm test、npm run build、npm run smoke 全部通过后发布。
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: x1080x-ex v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/x1080x-ex.user.js
            x1080x-ex-v${{ steps.version.outputs.version }}-source.zip
