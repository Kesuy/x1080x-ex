name: Validate and release v1.9.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync lockfile version
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Full validation
        run: npm run check

      - name: Commit generated release files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.9.0.yml
          git add package-lock.json dist/x1080x-ex.user.js
          git commit -m "chore: build v1.9.0 and remove temporary release workflow"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag v1.9.0
          git push origin v1.9.0

      - name: Create release assets
        run: |
          git archive --format=zip --prefix=x1080x-ex-1.9.0/ --output=x1080x-ex-1.9.0-source.zip HEAD
          cat > release-notes.md <<'NOTES'
          ## 更新内容

          - `agaghhh.cc` 新增按番号获取大 Preview：优先 hdblog，并沿用 hdblog 的“搜索结果屏蔽关键词”筛选规则。
          - hdblog 无可用 Preview 时，可启用官方后备源：FANZA → MGStage。
          - Preview 会直接显示在 agaghhh 主楼，并可与原帖封面一起下载。
          - 图片命名更新：存在 Preview 时原帖封面为 `番号 A.jpg`；单张 Preview 为 `番号 B.jpg`，多张为 `番号 B1.jpg`、`B2.jpg`……。
          - 修复跨域 Preview 能显示但无法下载的问题，下载时会优先使用图片真实来源页 Referer，并自动回退重试。
          - RAR/附件、真实演员查询、FC2 和种子下载原有逻辑保持兼容。
          - README 功能介绍已精简，安装入口继续使用 `main` 并更新缓存参数为 v1.9.0。

          ## 验证

          - 新增 HDblog 双搜索结果过滤、Preview 解析、FANZA/MGStage 后备源、原封面 + Preview 同时下载、单/多 Preview 命名等测试。
          - Node 22 下完整执行 `npm run check`，测试、build、smoke 全部通过后才创建标签和 Release。
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.9.0 \
            dist/x1080x-ex.user.js \
            x1080x-ex-1.9.0-source.zip \
            --title "x1080x-ex v1.9.0" \
            --notes-file release-notes.md
