name: Temporary Pixhost preview fix

on:
  push:
    branches:
      - fix/pixhost-preview-original

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync lockfile
        run: npm install --package-lock-only
      - name: Install dependencies
        run: npm ci
      - name: Test build smoke
        run: npm run check
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-userscript
          path: |
            dist/x1080x-ex.user.js
            package-lock.json
# rerun after Pixhost cache-test isolation
