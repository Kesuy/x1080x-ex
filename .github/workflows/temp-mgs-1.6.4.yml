name: Temporary MGS 1.6.4 validation

on:
  push:
    branches:
      - fix/mgs-title-support-1.6.4

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mgs-title-support-1.6.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply MGS support and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('src/core.js')
          text = core.read_text(encoding='utf-8')

          marker = "const LEADING_GROUP_PATTERN = /^(\\[([^\\]]*)\\]|\\(([^)]*)\\))\\s*/u;\n"
          addition = marker + "const MGS_RELEASE_PREFIX_PATTERN = /^\\[BT\\]\\s*\\(MGS\\)\\s*\\(([^)]+)\\)\\s*/i;\n"
          if 'MGS_RELEASE_PREFIX_PATTERN' not in text:
              if marker not in text:
                  raise SystemExit('LEADING_GROUP_PATTERN marker not found')
              text = text.replace(marker, addition, 1)

          old = "  const hasExternalSubtitle = groupedHasExternalSubtitle || SUBTITLE_TAG_PATTERN.test(remainder);\n  remainder = remainder.replace(SUBTITLE_TAG_PATTERN, '');\n\n  while (/^\\([^)]*\\)\\s*/u.test(remainder)) {\n"
          new = "  const hasExternalSubtitle = groupedHasExternalSubtitle || SUBTITLE_TAG_PATTERN.test(remainder);\n  remainder = remainder.replace(SUBTITLE_TAG_PATTERN, '');\n\n  const mgsReleasePrefix = remainder.match(MGS_RELEASE_PREFIX_PATTERN);\n  if (mgsReleasePrefix && mgsReleasePrefix[1].trim().toUpperCase() === code) {\n    remainder = remainder.slice(mgsReleasePrefix[0].length);\n  }\n\n  while (/^\\([^)]*\\)\\s*/u.test(remainder)) {\n"
          if 'const mgsReleasePrefix = remainder.match(MGS_RELEASE_PREFIX_PATTERN);' not in text:
              if old not in text:
                  raise SystemExit('parseThreadTitle insertion marker not found')
              text = text.replace(old, new, 1)
          core.write_text(text, encoding='utf-8')

          build = Path('scripts/build.mjs')
          build_text = build.read_text(encoding='utf-8')
          build_text = build_text.replace('// @version      1.6.3', '// @version      1.6.4', 1)
          build.write_text(build_text, encoding='utf-8')

          test = Path('test/mgs-title.test.js')
          test.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { JSDOM } from 'jsdom';
          import { buildDownloadJobs, parseThreadTitle } from '../src/core.js';

          test('MGS BT 标题清理与番号一致的发布前缀', () => {
            const fullTitle = '300MIUM-1407 [BT](MGS)(300MIUM-1407) 【美腳同期をNTR】美人同期に甘やかされる密會W不倫。普段は凜としたシゴデキ美女';
            assert.deepEqual(parseThreadTitle(fullTitle), {
              code: '300MIUM-1407',
              cleanTitle: '300MIUM-1407 【美腳同期をNTR】美人同期に甘やかされる密會W不倫。普段は凜としたシゴデキ美女',
              hasExternalSubtitle: false,
            });
          });

          test('MGS 发布前缀中的番号不一致时不误删', () => {
            const fullTitle = '300MIUM-1407 [BT](MGS)(OTHER-999) 正文标题';
            assert.deepEqual(parseThreadTitle(fullTitle), {
              code: '300MIUM-1407',
              cleanTitle: '300MIUM-1407 [BT](MGS)(OTHER-999) 正文标题',
              hasExternalSubtitle: false,
            });
          });

          test('MGS BT 页面生成清理后的 torrent 文件名', () => {
            const dom = new JSDOM(`
              <span id="thread_subject">300MIUM-1407 [BT](MGS)(300MIUM-1407) 正文标题</span>
              <div id="postlist"><table id="post_2803354"><tbody><tr><td id="postmessage_2803354" class="t_f">
                <img src="https://example.com/cover.jpg" width="1200" height="674">
                <img src="https://example.com/preview.jpg" width="1200" height="907">
                <div>下載地址：magnet:?xt=urn:btih:46d61f800c07c6ef8b0ab9d1bb163c83c4c725ce&amp;dn=300MIUM-1407</div>
              </td></tr></tbody></table></div>
            `, { url: 'https://agaghhh.cc/forum.php?mod=viewthread&tid=1054994' });

            assert.deepEqual(buildDownloadJobs(dom.window.document), [
              {
                kind: 'torrent',
                url: 'magnet:?xt=urn:btih:46d61f800c07c6ef8b0ab9d1bb163c83c4c725ce&dn=300MIUM-1407',
                name: '300MIUM-1407 正文标题.torrent',
              },
              {
                kind: 'image',
                url: 'https://example.com/preview.jpg',
                name: '300MIUM-1407.jpg',
              },
            ]);
            dom.window.close();
          });
          '''.replace('          ', ''), encoding='utf-8')
          PY

          npm version 1.6.4 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Test build smoke
        run: npm run check

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core.js test/mgs-title.test.js package.json package-lock.json scripts/build.mjs dist/x1080x-ex.user.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: support MGS BT titles on 1.6.4"
          git push origin HEAD:fix/mgs-title-support-1.6.4
