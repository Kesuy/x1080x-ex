name: Apply preview A/B naming patch

on:
  push:
    branches:
      - test/agaghhh-hdblog-preview
    paths:
      - .github/workflows/apply-preview-ab-naming.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/agaghhh-hdblog-preview
      - name: Apply naming changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'expected token not found: {label}')
              return text.replace(old, new, 1)

          p = Path('src/core.js')
          text = p.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "name: resources.imageFilename,",
              "name: resources.hdblogPreviews.length ? `${sanitizeFilename(resources.title.code || 'thread-image')} A.jpg` : resources.imageFilename,",
              'cover filename',
          )
          text = replace_once(
              text,
              "name: `${safeCode} -${index + 1}.jpg`,",
              "name: resources.title.code.startsWith('FC2-') ? `${safeCode} -${index + 1}.jpg` : `${safeCode} B${index + 1}.jpg`,",
              'preview filename',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('test/agaghhh-hdblog-preview.test.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "test('download jobs keep the agaghhh cover and append injected Preview images', () => {",
              "test('download jobs name the agaghhh cover A and injected Preview images B1/B2', () => {",
              1,
          )
          text = text.replace(
              "    'SVMGM-050.jpg',\n    'SVMGM-050 -1.jpg',\n    'SVMGM-050 -2.jpg',",
              "    'SVMGM-050 A.jpg',\n    'SVMGM-050 B1.jpg',\n    'SVMGM-050 B2.jpg',",
              1,
          )
          text = text.replace(
              "    'SVMGM-050.jpg',\n    'SVMGM-050 -1.jpg',",
              "    'SVMGM-050 A.jpg',\n    'SVMGM-050 B1.jpg',",
              1,
          )
          if "SVMGM-050 A.jpg" not in text or "SVMGM-050 B2.jpg" not in text:
              raise SystemExit('test naming patch did not apply')
          p.write_text(text, encoding='utf-8')

          p = Path('scripts/smoke.mjs')
          text = p.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "  { url: 'blob:smoke-2', name: 'ABCD-123.jpg' },\n  { url: 'blob:smoke-3', name: 'ABCD-123 -1.jpg' },",
              "  { url: 'blob:smoke-2', name: 'ABCD-123 A.jpg' },\n  { url: 'blob:smoke-3', name: 'ABCD-123 B1.jpg' },",
              'smoke filenames',
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'xshare.cc'
          git config user.email 'nicbest@163.com'
          git add src/core.js test/agaghhh-hdblog-preview.test.js scripts/smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: name cover A and previews B sequence'
          git push origin HEAD:test/agaghhh-hdblog-preview
