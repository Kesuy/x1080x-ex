name: Validate and release v1.7.3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync lockfile version
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Full validation
        run: npm run check

      - name: Commit generated release files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.7.3.yml
          git add package-lock.json dist/x1080x-ex.user.js
          git commit -m "chore: build v1.7.3 and remove temporary release workflow"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag v1.7.3
          git push origin v1.7.3

      - name: Create release assets
        run: |
          git archive --format=zip --prefix=x1080x-ex-1.7.3/ --output=x1080x-ex-1.7.3-source.zip HEAD
          cat > release-notes.md <<'NOTES'
          ## 更新内容

          - 保留 hdblog 自定义图床域名功能，继续用于未来图床域名或页面路径变化时的兼容。
          - 移除 Tampermonkey 菜单中单独的“hdblog 图床设置”入口。
          - 将“额外图床域名”并入现有“hdblog 设置”面板，配置入口更集中。
          - 内置 Pixhost 域名仍自动兼容，通常无需填写；只有未来出现新图床时再添加即可。

          ## 验证

          - 新增测试确认图床配置会注入 hdblog 设置面板、可以保存，并且不会再注册独立油猴菜单。
          - Node 22 下执行完整 `npm run check`，测试、build、smoke 全部通过后才创建正式标签和 Release。
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.7.3 \
            dist/x1080x-ex.user.js \
            x1080x-ex-1.7.3-source.zip \
            --title "x1080x-ex v1.7.3" \
            --notes-file release-notes.md
