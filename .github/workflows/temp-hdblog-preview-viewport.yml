name: Temporary hdblog Preview viewport

on:
  push:
    branches:
      - fix/hdblog-preview-viewport

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/hdblog-preview-viewport

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Test build smoke
        run: npm run check

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json dist/x1080x-ex.user.js
          if git diff --cached --quiet; then
            echo "generated files are already current"
            exit 0
          fi
          git commit -m "build: update userscript 1.6.3"
          git push origin HEAD:fix/hdblog-preview-viewport
