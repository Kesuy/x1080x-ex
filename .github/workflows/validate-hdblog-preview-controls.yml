name: Validate hdblog preview controls and layout polish

on:
  push:
    branches:
      - feat/hdblog-article-layout-download

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python3 scripts/patch_hdblog_preview_controls.py

      - name: Install dependencies
        run: npm ci

      - name: Full validation
        run: npm run check

      - name: Commit changes and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-hdblog-preview-controls.yml scripts/patch_hdblog_preview_controls.py
          git add src/hdblog-article.js src/hdblog-preview.js src/userscript.js test/hdblog-article.test.js test/hdblog-preview-real-dom.test.js test/hdblog-preview.test.js dist/x1080x-ex.user.js
          git commit -m "feat: add hdblog preview controls and soften article layout"
          git push origin HEAD:feat/hdblog-article-layout-download
