name: Validate hdblog preview controls and layout polish

on:
  push:
    branches: [feat/hdblog-article-layout-download]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply hdblog controls and layout polish
        run: |
          python3 <<'PY'
          from pathlib import Path

          article_path = Path('src/hdblog-article.js')
          source = article_path.read_text(encoding='utf-8')

          old_keys = """export const HDBLOG_ARTICLE_WIDTH_KEY = 'x1080x-ex:hdblog-article-width';
export const HDBLOG_SHOW_DOWNLOAD_AREA_KEY = 'x1080x-ex:hdblog-show-download-area';
export const HDBLOG_BLOCKED_KEYWORDS_KEY = 'x1080x-ex:hdblog-blocked-keywords';
"""
          new_keys = """export const HDBLOG_ARTICLE_WIDTH_KEY = 'x1080x-ex:hdblog-article-width';
export const HDBLOG_SHOW_DOWNLOAD_AREA_KEY = 'x1080x-ex:hdblog-show-download-area';
export const HDBLOG_SHOW_IMAGE_DOWNLOAD_BUTTON_KEY = 'x1080x-ex:hdblog-show-image-download-button';
export const HDBLOG_EXPAND_PREVIEW_IMAGES_KEY = 'x1080x-ex:hdblog-expand-preview-images';
export const HDBLOG_BLOCKED_KEYWORDS_KEY = 'x1080x-ex:hdblog-blocked-keywords';
"""
          if old_keys not in source:
              raise SystemExit('article setting keys block not found')
          source = source.replace(old_keys, new_keys, 1)

          old_layout = """body.${ARTICLE_BODY_CLASS} article.entry,
body.${ARTICLE_BODY_CLASS} article.post {
  width: min(100%, var(--x1080x-hdblog-original-article-width)) !important;
  max-width: var(--x1080x-hdblog-original-article-width) !important;
  box-sizing: border-box !important;
  margin-left: auto !important;
  margin-right: auto !important;
}
body.${ARTICLE_BODY_CLASS} article.entry > .entry-header,
body.${ARTICLE_BODY_CLASS} article.post > .entry-header,
body.${ARTICLE_BODY_CLASS} article.entry > .entry-content,
body.${ARTICLE_BODY_CLASS} article.post > .entry-content {
  width: 100% !important;
  max-width: none !important;
  box-sizing: border-box !important;
}
"""
          new_layout = """body.${ARTICLE_BODY_CLASS} article.entry,
body.${ARTICLE_BODY_CLASS} article.post {
  width: 100% !important;
  max-width: none !important;
  box-sizing: border-box !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
  box-shadow: none !important;
}
body.${ARTICLE_BODY_CLASS} article.entry > .entry-header,
body.${ARTICLE_BODY_CLASS} article.post > .entry-header,
body.${ARTICLE_BODY_CLASS} article.entry > .entry-content,
body.${ARTICLE_BODY_CLASS} article.post > .entry-content,
body.${ARTICLE_BODY_CLASS} article.entry > .entry-footer,
body.${ARTICLE_BODY_CLASS} article.post > .entry-footer,
body.${ARTICLE_BODY_CLASS} main#genesis-content > .entry-comments,
body.${ARTICLE_BODY_CLASS} main#genesis-content > .comment-respond,
body.${ARTICLE_BODY_CLASS} #genesis-content.content > .entry-comments,
body.${ARTICLE_BODY_CLASS} #genesis-content.content > .comment-respond {
  width: min(100%, var(--x1080x-hdblog-original-article-width)) !important;
  max-width: var(--x1080x-hdblog-original-article-width) !important;
  box-sizing: border-box !important;
  margin-left: auto !important;
  margin-right: auto !important;
}
"""
          if old_layout not in source:
              raise SystemExit('article inner layout block not found')
          source = source.replace(old_layout, new_layout, 1)

          old_read = """function readDownloadAreaVisible() {
  if (typeof GM_getValue !== 'function') return true;
  return GM_getValue(HDBLOG_SHOW_DOWNLOAD_AREA_KEY, true) !== false;
}

function readBlockedKeywordsText() {
"""
          new_read = """function readDownloadAreaVisible() {
  if (typeof GM_getValue !== 'function') return true;
  return GM_getValue(HDBLOG_SHOW_DOWNLOAD_AREA_KEY, true) !== false;
}

function readImageDownloadButtonVisible() {
  if (typeof GM_getValue !== 'function') return true;
  return GM_getValue(HDBLOG_SHOW_IMAGE_DOWNLOAD_BUTTON_KEY, true) !== false;
}

export function isHdblogPreviewExpansionEnabled() {
  if (typeof GM_getValue !== 'function') return true;
  return GM_getValue(HDBLOG_EXPAND_PREVIEW_IMAGES_KEY, true) !== false;
}

function readBlockedKeywordsText() {
"""
          if old_read not in source:
              raise SystemExit('article read settings anchor not found')
          source = source.replace(old_read, new_read, 1)

          old_panel = """    <label style=\"display:flex;align-items:center;gap:9px;margin-bottom:16px;font-weight:600\">
      <input data-setting=\"show-downloads\" type=\"checkbox\">
      显示 Btfile / katfile / Freedl / Rapidgator 网盘下载区域
    </label>
    <label style=\"display:block;margin-bottom:18px\">
"""
          new_panel = """    <div style=\"margin:2px 0 18px;padding:14px 15px;border:1px solid #e3e6ea;border-radius:8px;background:#f8f9fa\">
      <div style=\"font-weight:700;margin-bottom:10px\">文章页显示</div>
      <label style=\"display:flex;align-items:center;gap:9px;margin-bottom:10px\">
        <input data-setting=\"show-downloads\" type=\"checkbox\">
        显示 Btfile / katfile / Freedl / Rapidgator 网盘下载区域
      </label>
      <label style=\"display:flex;align-items:center;gap:9px;margin-bottom:10px\">
        <input data-setting=\"show-image-download\" type=\"checkbox\">
        显示标题旁的图片下载按钮（⬇）
      </label>
      <label style=\"display:flex;align-items:center;gap:9px\">
        <input data-setting=\"expand-preview\" type=\"checkbox\">
        自动展开 Preview 大图
      </label>
      <small style=\"display:block;margin-top:9px;color:#666\">关闭 Preview 大图后保留网站原始缩略图；保存设置后页面会自动刷新。</small>
    </div>
    <label style=\"display:block;margin-bottom:18px\">
"""
          if old_panel not in source:
              raise SystemExit('settings panel checkbox block not found')
          source = source.replace(old_panel, new_panel, 1)

          old_query = """  const widthInput = panel.querySelector('[data-setting=\"width\"]');
  const downloadsInput = panel.querySelector('[data-setting=\"show-downloads\"]');
  const keywordsInput = panel.querySelector('[data-setting=\"keywords\"]');
  widthInput.value = rawStoredWidth();
  downloadsInput.checked = readDownloadAreaVisible();
  keywordsInput.value = readBlockedKeywordsText();
"""
          new_query = """  const widthInput = panel.querySelector('[data-setting=\"width\"]');
  const downloadsInput = panel.querySelector('[data-setting=\"show-downloads\"]');
  const imageDownloadInput = panel.querySelector('[data-setting=\"show-image-download\"]');
  const previewInput = panel.querySelector('[data-setting=\"expand-preview\"]');
  const keywordsInput = panel.querySelector('[data-setting=\"keywords\"]');
  widthInput.value = rawStoredWidth();
  downloadsInput.checked = readDownloadAreaVisible();
  imageDownloadInput.checked = readImageDownloadButtonVisible();
  previewInput.checked = isHdblogPreviewExpansionEnabled();
  keywordsInput.value = readBlockedKeywordsText();
"""
          if old_query not in source:
              raise SystemExit('settings panel input wiring not found')
          source = source.replace(old_query, new_query, 1)

          old_save = """    if (typeof GM_setValue === 'function') {
      GM_setValue(HDBLOG_ARTICLE_WIDTH_KEY, widthText ? numeric : '');
      GM_setValue(HDBLOG_SHOW_DOWNLOAD_AREA_KEY, downloadsInput.checked);
      GM_setValue(HDBLOG_BLOCKED_KEYWORDS_KEY, normalizeBlockedKeywordsText(keywordsInput.value));
    }

    if (isHdblogArticlePage(document, document.location)) {
      if (widthText) applyHdblogArticleLayout(document, numeric);
      else clearHdblogArticleLayout(document);
      applyHdblogDownloadAreaVisibility(document, downloadsInput.checked);
    }
    closeHdblogSettingsPanel(document);
"""
          new_save = """    if (typeof GM_setValue === 'function') {
      GM_setValue(HDBLOG_ARTICLE_WIDTH_KEY, widthText ? numeric : '');
      GM_setValue(HDBLOG_SHOW_DOWNLOAD_AREA_KEY, downloadsInput.checked);
      GM_setValue(HDBLOG_SHOW_IMAGE_DOWNLOAD_BUTTON_KEY, imageDownloadInput.checked);
      GM_setValue(HDBLOG_EXPAND_PREVIEW_IMAGES_KEY, previewInput.checked);
      GM_setValue(HDBLOG_BLOCKED_KEYWORDS_KEY, normalizeBlockedKeywordsText(keywordsInput.value));
    }

    closeHdblogSettingsPanel(document);
    const view = document.defaultView;
    if (view?.location?.reload) view.location.reload();
"""
          if old_save not in source:
              raise SystemExit('settings save block not found')
          source = source.replace(old_save, new_save, 1)

          old_install = """  applyHdblogDownloadAreaVisibility(document, readDownloadAreaVisible());
  installDownloadButton(document, locationObject, gmRequest);
}
"""
          new_install = """  applyHdblogDownloadAreaVisibility(document, readDownloadAreaVisible());
  if (readImageDownloadButtonVisible()) installDownloadButton(document, locationObject, gmRequest);
  else document.getElementById(DOWNLOAD_BUTTON_ID)?.remove();
}
"""
          if old_install not in source:
              raise SystemExit('article install button block not found')
          source = source.replace(old_install, new_install, 1)
          article_path.write_text(source, encoding='utf-8')

          preview_path = Path('src/hdblog-preview.js')
          preview = preview_path.read_text(encoding='utf-8')
          old_import = "import { isPixhostShowUrl, resolvePixhostShowUrl } from './pixhost.js';\n"
          new_import = "import { isPixhostShowUrl, resolvePixhostShowUrl } from './pixhost.js';\nimport { isHdblogPreviewExpansionEnabled } from './hdblog-article.js';\n"
          if old_import not in preview:
              raise SystemExit('preview import anchor not found')
          preview = preview.replace(old_import, new_import, 1)

          old_width = """const PREVIEW_VIEWPORT_GUTTER_PX = 12;
const PREVIEW_VIEWPORT_WIDTH = `calc(100vw - ${PREVIEW_VIEWPORT_GUTTER_PX * 2}px)`;
"""
          new_width = """const PREVIEW_VIEWPORT_WIDTH = 'min(var(--x1080x-hdblog-article-width, 100%), calc(100vw - 40px))';
"""
          if old_width not in preview:
              raise SystemExit('preview width constants not found')
          preview = preview.replace(old_width, new_width, 1)

          old_preview_install = """export function installHdblogPreviewImages(document = globalThis.document, locationObject = globalThis.location) {
  if (!document || !isHdblogHost(locationObject)) return;
  const run = () => {
"""
          new_preview_install = """export function installHdblogPreviewImages(document = globalThis.document, locationObject = globalThis.location) {
  if (!document || !isHdblogHost(locationObject) || !isHdblogPreviewExpansionEnabled()) return;
  const run = () => {
    if (!isHdblogPreviewExpansionEnabled()) return;
"""
          if old_preview_install not in preview:
              raise SystemExit('preview install block not found')
          preview = preview.replace(old_preview_install, new_preview_install, 1)
          preview_path.write_text(preview, encoding='utf-8')

          userscript_path = Path('src/userscript.js')
          userscript = userscript_path.read_text(encoding='utf-8')
          old_user_key = "const STORAGE_KEY = 'x1080x-ex:domains';\n"
          new_user_key = "const STORAGE_KEY = 'x1080x-ex:domains';\nconst HDBLOG_EXPAND_PREVIEW_IMAGES_KEY = 'x1080x-ex:hdblog-expand-preview-images';\n"
          if old_user_key not in userscript:
              raise SystemExit('userscript storage key anchor not found')
          userscript = userscript.replace(old_user_key, new_user_key, 1)

          old_user_call = """if (isAllowedHost(location.hostname, getConfiguredDomains())) {
  expandHdblogPreviewImages();
  if (isThreadPage()) addDownloadButton();
"""
          new_user_call = """if (isAllowedHost(location.hostname, getConfiguredDomains())) {
  const expandHdblogPreview = typeof GM_getValue !== 'function'
    || GM_getValue(HDBLOG_EXPAND_PREVIEW_IMAGES_KEY, true) !== false;
  if (expandHdblogPreview) expandHdblogPreviewImages();
  if (isThreadPage()) addDownloadButton();
"""
          if old_user_call not in userscript:
              raise SystemExit('userscript preview call block not found')
          userscript = userscript.replace(old_user_call, new_user_call, 1)
          userscript_path.write_text(userscript, encoding='utf-8')

          test_path = Path('test/hdblog-article.test.js')
          test = test_path.read_text(encoding='utf-8')
          old_import_test = """  installHdblogArticleEnhancement,
  normalizeHdblogArticleWidth,
} from '../src/hdblog-article.js';
"""
          new_import_test = """  installHdblogArticleEnhancement,
  normalizeHdblogArticleWidth,
  openHdblogSettingsPanel,
} from '../src/hdblog-article.js';
"""
          if old_import_test not in test:
              raise SystemExit('article test import block not found')
          test = test.replace(old_import_test, new_import_test, 1)

          old_asserts = """  assert.match(style.textContent, /article\\.entry,[\\s\\S]*?width:\\s*min\\(100%, var\\(--x1080x-hdblog-original-article-width\\)\\) !important/);
  assert.match(style.textContent, /max-width:\\s*var\\(--x1080x-hdblog-original-article-width\\) !important/);
"""
          new_asserts = """  assert.match(style.textContent, /article\\.entry,[\\s\\S]*?width:\\s*100% !important/);
  assert.match(style.textContent, /article\\.entry > \\.entry-header,[\\s\\S]*?width:\\s*min\\(100%, var\\(--x1080x-hdblog-original-article-width\\)\\) !important/);
  assert.match(style.textContent, /max-width:\\s*var\\(--x1080x-hdblog-original-article-width\\) !important/);
  assert.match(style.textContent, /box-shadow:\\s*none !important/);
"""
          if old_asserts not in test:
              raise SystemExit('article layout test assertions not found')
          test = test.replace(old_asserts, new_asserts, 1)

          insert_anchor = """test('article download button uses an icon-only idle label', () => {
"""
          settings_test = r'''test('hdblog settings panel includes download-button and Preview expansion switches', () => {
  const dom = articleDom();
  const panel = openHdblogSettingsPanel(dom.window.document);
  assert.ok(panel);
  assert.ok(panel.querySelector('[data-setting="show-downloads"]'));
  assert.ok(panel.querySelector('[data-setting="show-image-download"]'));
  assert.ok(panel.querySelector('[data-setting="expand-preview"]'));
  assert.ok(panel.querySelector('[data-setting="keywords"]'));
  panel.remove();
});

'''
          if insert_anchor not in test:
              raise SystemExit('article test insertion anchor not found')
          test = test.replace(insert_anchor, settings_test + insert_anchor, 1)
          test_path.write_text(test, encoding='utf-8')

          preview_test_path = Path('test/hdblog-preview-real-dom.test.js')
          preview_test = preview_test_path.read_text(encoding='utf-8')
          preview_test = preview_test.replace("'calc(100vw - 24px)'", "'min(var(--x1080x-hdblog-article-width, 100%), calc(100vw - 40px))'")
          preview_test_path.write_text(preview_test, encoding='utf-8')

          user_preview_test_path = Path('test/hdblog-preview.test.js')
          user_preview_test = user_preview_test_path.read_text(encoding='utf-8')
          disabled_anchor = """test('非 hdblog 域名不修改同样的 Preview 页面结构', async () => {
"""
          disabled_test = r'''test('hdblog Preview 大图设置关闭时保留原始缩略图', async () => {
  const dom = new JSDOM(`
    <main id="genesis-content"><article class="entry"><div class="entry-content">
      <p><strong>Preview:</strong></p>
      <p><a href="/full.jpg"><img id="preview-disabled" src="/thumb.jpg" width="300"></a></p>
    </div></article></main>
  `, { url: 'https://hdblog.me/example/' });
  const restore = installDomGlobals(dom.window);
  globalThis.GM_getValue = (key, fallback) => (
    key === 'x1080x-ex:hdblog-expand-preview-images' ? false : fallback
  );

  try {
    await import(`../src/userscript.js?hdblog-preview-disabled=${Date.now()}`);
    const image = dom.window.document.querySelector('#preview-disabled');
    assert.equal(image.src, 'https://hdblog.me/thumb.jpg');
    assert.equal(image.getAttribute('width'), '300');
    assert.equal(image.dataset.x1080xPreviewExpanded, undefined);
  } finally {
    restore();
    dom.window.close();
  }
});

'''
          if disabled_anchor not in user_preview_test:
              raise SystemExit('preview test insertion anchor not found')
          user_preview_test = user_preview_test.replace(disabled_anchor, disabled_test + disabled_anchor, 1)
          user_preview_test_path.write_text(user_preview_test, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Full validation
        run: npm run check

      - name: Commit rebuilt userscript and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-hdblog-preview-controls.yml
          git add src/hdblog-article.js src/hdblog-preview.js src/userscript.js test/hdblog-article.test.js test/hdblog-preview-real-dom.test.js test/hdblog-preview.test.js dist/x1080x-ex.user.js
          git commit -m "feat: add hdblog preview controls and soften article layout"
          git push origin HEAD:feat/hdblog-article-layout-download
