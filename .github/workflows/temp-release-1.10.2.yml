name: Release Preview duplicate fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test fix
        run: npm test
      - name: Bump patch version
        run: npm version patch --no-git-tag-version
      - run: npm run build
      - run: npm run smoke
      - name: Remove temporary release workflow
        run: rm -f .github/workflows/temp-release-1.10.2.yml
      - name: Commit release files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add -A
          git commit -m "release: v${VERSION}"
          git push
      - name: Prepare release
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          git archive --format=zip --output="x1080x-ex-v${VERSION}-source.zip" HEAD
          cat > release-notes.md <<'EOF'
          ## 修复 Preview 2 误识别

          - 修复 agaghhh 帖子中 `Preview 2/3/...` 被当作有效预览图参与下载的问题。
          - 当 HDblog 已取得真实 Preview 时，优先使用 HDblog Preview，论坛 Pixhost Preview 不再重复加入下载任务。
          - 当 HDblog 没有取得 Preview 时，论坛首个 Preview 仍作为 fallback；编号为 `Preview 2/3/...` 的重复或失效项会被忽略。
          - 增加 CEMD-826 场景回归测试。

          ## 验证

          npm test、npm run build、npm run smoke 全部通过后发布。
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: x1080x-ex v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/x1080x-ex.user.js
            x1080x-ex-v${{ steps.version.outputs.version }}-source.zip
